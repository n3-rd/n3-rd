name: generate profile widgets

# one button, one run — builds snake, 3d skyline, activity graph, and
# spotify together, then pushes them all to "output" in a single commit
on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: install python deps
        run: pip install requests

      - name: make dist folder
        run: mkdir -p dist

      - name: generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: n3-rd
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: generate 3d skyline
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          username: n3-rd

      - name: move 3d skyline into dist
        run: cp profile-3d-contrib/*.svg dist/ 2>/dev/null || true

      - name: generate activity graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: n3-rd
          options: bg_color=0d1117&color=00FF9D&line=FF00C8&point=00D4FF&area=true&hide_border=true
          output_path: dist/activity-graph.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: generate spotify card
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: python spotify_card.py

      - name: deploy everything together
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
